name: StimmaMobile
options:
  bundleIdPrefix: ai.stimma
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SUPPORTS_MACCATALYST: NO
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  StimmaMobile:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
      - path: Frontend
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.stimma.mobile
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Simulator.entitlements
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  StimmaMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: StimmaMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.stimma.mobile.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  StimmaMobile:
    build:
      targets:
        StimmaMobile: all
    run:
      config: Debug
    test:
      targets:
        - StimmaMobileUITests
