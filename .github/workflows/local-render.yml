name: Local rendering
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/utils/*render*'
      - 'backend/render_fonts/**'
      - 'backend/tests/test_local_render.py'
      - 'electron/**'
      - 'packaging/headless/**'
      - 'tools/render_test.py'
      - '.github/workflows/local-render.yml'
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: ${{ runner.environment == 'github-hosted' }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: uv sync --project backend --extra dev --locked
      - run: npm ci --prefix electron
      - name: Linux browser libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64 xvfb
      - name: Configure Electron sandbox helper
        if: runner.os == 'Linux'
        run: |
          node -e "require('./electron/node_modules/electron')"
          sudo chown root:root electron/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 electron/node_modules/electron/dist/chrome-sandbox
      - name: Linux captures
        if: runner.os == 'Linux'
        run: xvfb-run -a tools/stimma render-test
      - name: macOS captures
        if: runner.os == 'macOS'
        run: tools/stimma render-test
      - name: Windows captures
        if: runner.os == 'Windows'
        run: tools/stimma.cmd render-test
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: ${{ runner.environment == 'github-hosted' }}
      - run: uv sync --project backend --extra dev --locked
      - run: tools/stimma headless image --tag stimma-render:test
      - run: tools/stimma render-test --docker stimma-render:test
