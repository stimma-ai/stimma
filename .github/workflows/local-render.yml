name: Local rendering
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/utils/*render*'
      - 'backend/render_fonts/**'
      - 'backend/tests/test_local_render.py'
      - 'electron/**'
      - 'packaging/headless/**'
      - 'tools/render_test.py'
      - '.github/workflows/local-render.yml'
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: uv sync --project backend --extra dev --locked
      - run: npm ci --prefix electron
      - name: Linux browser libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64 xvfb
      - name: Linux captures
        if: runner.os == 'Linux'
        run: xvfb-run -a tools/stimma render-test
      - name: macOS captures
        if: runner.os == 'macOS'
        run: tools/stimma render-test
      - name: Windows captures
        if: runner.os == 'Windows'
        run: tools/stimma.cmd render-test
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --project backend --extra dev --locked
      - run: tools/stimma headless image --tag stimma-render:test
      - run: tools/stimma render-test --docker stimma-render:test
