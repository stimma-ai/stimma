name: Quality Gate
run-name: Quality Gate - ${{ inputs.ref || github.ref_name || 'manual' }}

on:
  workflow_call:
    inputs:
      reuse_ci:
        description: Reuse successful same-repository PR checks for an identical source tree
        type: boolean
        default: false
      acceptance_runs_on:
        description: Optional faster pool for serial browser acceptance lanes
        type: string
        default: ""
      runs_on:
        description: Runner pool (trusted builds may use isolated self-hosted slots)
        type: string
        # Keep hosted browser jobs on an OS supported by locked Playwright.
        default: '"ubuntu-24.04"'
      ref:
        description: Git ref to test
        required: false
        default: ""
        type: string
      acceptance_suite:
        description: "Acceptance suite to run: smoke or full"
        required: false
        default: smoke
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to test
        required: false
        default: ""
      acceptance_suite:
        description: Acceptance suite to run
        required: false
        default: smoke
        type: choice
        options:
          - smoke
          - full

permissions:
  contents: read
  actions: read

jobs:
  evidence:
    name: Resolve test evidence
    runs-on: ${{ fromJSON(inputs.runs_on || '"ubuntu-24.04"') }}
    outputs:
      reused: ${{ steps.proof.outputs.reused }}
      ref: ${{ steps.proof.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Look for identical tested source
        id: proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REUSE_CI: ${{ inputs.reuse_ci }}
          ACCEPTANCE_SUITE: ${{ inputs.acceptance_suite || 'smoke' }}
        run: |
          if [ -f scripts/ci-quality-proof.py ]; then
            python3 scripts/ci-quality-proof.py lookup
          else
            # Older refs predate quality receipts; test them without reuse.
            echo "reused=false" >> "$GITHUB_OUTPUT"
            echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  release-cleanup-tests:
    needs: evidence
    if: needs.evidence.outputs.reused != 'true'
    name: Release tooling tests
    runs-on: ${{ fromJSON(inputs.runs_on || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.evidence.outputs.ref }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: ${{ runner.environment == 'github-hosted' }}
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: 'v2.9.8'
      - run: tools/stimma test release-cleanup
      - run: tools/stimma test release-pipeline
      - run: tools/stimma test ci-runner

  desktop-tests:
    needs: evidence
    if: needs.evidence.outputs.reused != 'true'
    name: Electron type check and unit tests
    runs-on: ${{ fromJSON(inputs.runs_on || '"ubuntu-24.04"') }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.evidence.outputs.ref }}
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: electron/package-lock.json
      - name: Install shell dependencies
        run: npm ci --prefix electron
      - name: Type-check shell
        run: tools/stimma lint desktop
      - name: Build shell
        run: npm run build --prefix electron
      - name: Run shell unit tests
        run: tools/stimma test desktop --unit

  backend-tests:
    needs: evidence
    if: needs.evidence.outputs.reused != 'true'
    name: Backend tests (${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ${{ fromJSON(inputs.runs_on || '"ubuntu-24.04"') }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.evidence.outputs.ref }}

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: ${{ runner.environment == 'github-hosted' }}
          cache-local-path: ~/.cache/uv

      - name: Install backend deps
        working-directory: backend
        run: uv sync --all-extras --locked

      - name: Lint backend
        run: tools/stimma lint backend

      - name: Prepare test scratch
        run: python3 scripts/ci-test-scratch.py

      - name: Run backend tests
        env:
          STIMMA_TEST_SHARD: ${{ matrix.shard }}/4
        # -m "not darkroom": the Darkroom tool tests cover rarely-changing
        # vendored code; run them locally or explicitly with -m darkroom.
        run: tools/stimma test backend -p ci_shard -vv -rA --durations=15 --maxfail=1 -m "not darkroom"

      - name: Clean test scratch
        if: always()
        run: python3 scripts/ci-test-scratch.py cleanup

  frontend-tests:
    needs: evidence
    if: needs.evidence.outputs.reused != 'true'
    name: Frontend regressions (${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # Trusted callers select prepared workers; external PRs retain the hosted default.
    runs-on: ${{ fromJSON(inputs.runs_on || '"ubuntu-24.04"') }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.evidence.outputs.ref }}
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: frontend/package-lock.json
      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: ${{ runner.environment == 'github-hosted' }}
          cache-local-path: ~/.cache/uv
      - name: Install backend deps
        working-directory: backend
        run: uv sync --all-extras --locked
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install FFmpeg
        timeout-minutes: 6
        uses: ./.github/actions/setup-ffmpeg
      - name: Install Playwright Chromium
        timeout-minutes: 3
        uses: ./.github/actions/setup-playwright
      - name: Prepare test scratch
        run: python3 scripts/ci-test-scratch.py
      - name: Run frontend regression tests
        run: tools/stimma test frontend --test-shard=${{ matrix.shard }}/2
      - name: Check unused frontend files
        if: matrix.shard == 1
        run: tools/stimma lint frontend-dead-code
      - name: Clean test scratch
        if: always()
        run: python3 scripts/ci-test-scratch.py cleanup

  acceptance-tests:
    needs: evidence
    if: needs.evidence.outputs.reused != 'true'
    name: Acceptance tests (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        lane: [desktop, phone-1, phone-2, phone-3]
    runs-on: ${{ fromJSON(inputs.acceptance_runs_on || inputs.runs_on || '"ubuntu-24.04"') }}
    timeout-minutes: ${{ inputs.acceptance_suite == 'full' && 35 || 12 }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.evidence.outputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: frontend/package-lock.json

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: ${{ runner.environment == 'github-hosted' }}
          cache-local-path: ~/.cache/uv

      - name: Install backend deps
        working-directory: backend
        run: uv sync --all-extras --locked

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install FFmpeg
        timeout-minutes: 6
        uses: ./.github/actions/setup-ffmpeg

      - name: Install Playwright Chromium
        timeout-minutes: 3
        uses: ./.github/actions/setup-playwright

      - name: Lint frontend (small-screen ratchet)
        run: tools/stimma lint frontend

      - name: Prepare test scratch
        run: python3 scripts/ci-test-scratch.py

      - name: Run smoke acceptance tests
        if: ${{ matrix.lane == 'desktop' && inputs.acceptance_suite != 'full' }}
        run: tools/stimma test acceptance acceptance/tests/release-acceptance.spec.ts --timeout=60000 --retries=0

      - name: Run full acceptance tests
        if: ${{ matrix.lane == 'desktop' && inputs.acceptance_suite == 'full' }}
        run: tools/stimma test acceptance --max-failures=1 --retries=0

      - name: Run phone lane (route audit)
        if: matrix.lane != 'desktop'
        env:
          LANE: ${{ matrix.lane }}
        run: STIMMA_ACCEPTANCE_PHONE_SHARD="${LANE#phone-}/3" tools/stimma test acceptance --viewport=phone --timeout=30000 --retries=0

      - name: Upload phone screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phone-shots-${{ matrix.lane }}
          retention-days: 5
          if-no-files-found: ignore
          path: frontend/acceptance/phone-shots/

      - name: Upload acceptance artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-artifacts-${{ matrix.lane }}
          retention-days: 2
          if-no-files-found: ignore
          path: |
            frontend/test-results/
            frontend/acceptance/playwright-report/
            frontend/acceptance/acceptance/

      - name: Clean test scratch
        if: always()
        run: python3 scripts/ci-test-scratch.py cleanup

  passed:
    name: Quality gate passed
    if: always()
    needs: [evidence, backend-tests, frontend-tests, acceptance-tests, desktop-tests, release-cleanup-tests]
    runs-on: ${{ fromJSON(inputs.runs_on || '"ubuntu-24.04"') }}
    steps:
      - name: Require every test shard
        env:
          EVIDENCE: ${{ needs.evidence.result }}
          REUSED: ${{ needs.evidence.outputs.reused }}
          BACKEND: ${{ needs.backend-tests.result }}
          FRONTEND: ${{ needs.frontend-tests.result }}
          ACCEPTANCE: ${{ needs.acceptance-tests.result }}
          DESKTOP: ${{ needs.desktop-tests.result }}
          RELEASE_CLEANUP: ${{ needs.release-cleanup-tests.result }}
        run: test "$EVIDENCE" = success && { test "$REUSED" = true || { test "$BACKEND" = success && test "$FRONTEND" = success && test "$ACCEPTANCE" = success && test "$DESKTOP" = success && test "$RELEASE_CLEANUP" = success; }; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.evidence.outputs.ref }}
      - name: Record tested source tree
        id: receipt
        env:
          ACCEPTANCE_SUITE: ${{ inputs.acceptance_suite || 'smoke' }}
        run: |
          if [ -f scripts/ci-quality-proof.py ]; then
            python3 scripts/ci-quality-proof.py record
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.receipt.outputs.created == 'true'
        with:
          name: quality-proof-${{ inputs.acceptance_suite || 'smoke' }}
          path: ${{ runner.temp }}/quality-proof.json
          retention-days: 7
