name: Build / Linux AppImage
run-name: ${{ github.event_name == 'push' && format('Build / Linux AppImage - {0}', github.ref_name) || format('Build / Linux AppImage - {0}', inputs.channel) }}

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      channel:
        required: true
        type: string
      version:
        required: false
        type: string
      publish_updates:
        required: true
        type: boolean
      publish_github_release:
        required: false
        default: false
        type: boolean
      arch:
        required: false
        default: x86_64
        type: string
      # The preflight below enforces Ubuntu 22.04 as the glibc compatibility
      # floor. The AppImage runtime is static, avoiding a host libfuse2
      # dependency on current distributions (the kernel FUSE device remains).
      runs_on:
        required: false
        default: '"ubuntu-22.04"'
        type: string

permissions:
  contents: write

jobs:
  linux-appimage:
    name: Build Linux AppImage (${{ inputs.arch }})
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 35

    env:
      STIMMA_DISTRIBUTION: official
      STIMMA_RELEASE_CHANNEL: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) && (contains(github.ref_name, '-beta.') && 'beta' || 'production') || inputs.channel }}
      STIMMA_UPDATE_BASE_URL: ${{ vars.STIMMA_UPDATE_BASE_URL || 'https://updates.stimma.ai' }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_S3_ENDPOINT: ${{ vars.R2_S3_ENDPOINT }}
      GITHUB_TOKEN: ${{ github.token }}
      UV_PYTHON_DOWNLOADS: true
      LINUX_ARCH: ${{ inputs.arch }}
      LINUX_PLATFORM: ${{ inputs.arch == 'aarch64' && 'linux-aarch64' || 'linux-x86_64' }}
      LINUX_TARGET_TRIPLE: ${{ inputs.arch == 'aarch64' && 'aarch64-unknown-linux-gnu' || 'x86_64-unknown-linux-gnu' }}
      # electron-builder suffixes the Linux update manifest with the arch on
      # every arch except x64, and electron-updater asks for the matching name
      # (Provider.getChannelFilePrefix()). Both sides must agree or arm64
      # clients 404 on the feed and updates silently never apply.
      ELECTRON_MANIFEST_SUFFIX: ${{ inputs.arch == 'aarch64' && '-linux-arm64' || '-linux' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.ref }}

      - name: Install Linux build and smoke-test dependencies
        run: |
          set -euo pipefail
          if command -v sudo >/dev/null 2>&1; then
            SUDO=(sudo)
          elif [ "$(id -u)" -eq 0 ]; then
            SUDO=()
          else
            echo "sudo is required to install Linux build dependencies when the runner is not root."
            exit 1
          fi
          "${SUDO[@]}" apt-get update
          "${SUDO[@]}" apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libasound2-dev \
            libgbm1 \
            libgtk-3-0 \
            libnss3 \
            libxss1 \
            patchelf \
            pkg-config \
            xdg-utils \
            xvfb

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            electron/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: native/stimma-native
          save-if: false

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Preflight environment
        run: |
          set -euo pipefail
          uname -a
          lsb_release -a || true
          node --version
          npm --version
          rustc --version
          cargo --version
          uv --version
          . /etc/os-release
          if [ "$ID" != "ubuntu" ] || [ "$VERSION_ID" != "22.04" ]; then
            echo "Linux release artifacts must be built on Ubuntu 22.04; got $ID $VERSION_ID."
            exit 1
          fi
          echo "Linux platform: $LINUX_PLATFORM"
          echo "Expected Rust target: $LINUX_TARGET_TRIPLE"
          host_target="$(rustc -Vv | awk '/^host:/ {print $2}')"
          if [ "$host_target" != "$LINUX_TARGET_TRIPLE" ]; then
            echo "Runner Rust host target $host_target does not match expected $LINUX_TARGET_TRIPLE."
            exit 1
          fi
          command -v file
          command -v patchelf
          command -v xdg-open

      - name: Setup Python via uv
        run: |
          set -euo pipefail
          uv python install --force 3.11
          uv run --python 3.11 python --version

      # Frontend dependencies also provide the Tauri signer needed only for
      # the one-time Tauri -> Electron updater handoff artifact.
      - name: Install frontend deps
        working-directory: frontend
        run: npm install

      - name: Install backend deps
        working-directory: backend
        run: uv sync --all-extras --locked

      - name: Resolve app version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          CHANNEL: ${{ env.STIMMA_RELEASE_CHANNEL }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION}"
          if [ -z "$VERSION" ] && [ "$EVENT_NAME" = "push" ]; then
            if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
              echo "Release tags must look like v1.2.3 or v1.2.3-beta.1."
              exit 1
            fi
            VERSION="${REF_NAME#v}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="0.0.0-${CHANNEL}.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate channel icons
        env:
          CHANNEL: ${{ env.STIMMA_RELEASE_CHANNEL }}
        working-directory: backend
        run: uv run --python 3.11 python ../scripts/generate-icons.py --channel "$CHANNEL"

      - name: Build Electron AppImage
        timeout-minutes: 25
        env:
          CHANNEL: ${{ env.STIMMA_RELEASE_CHANNEL }}
          STIMMA_APP_VERSION: ${{ steps.version.outputs.version }}
          VITE_STIMMA_RELEASE_CHANNEL: ${{ env.STIMMA_RELEASE_CHANNEL }}
          VITE_STIMMA_UPDATE_ENDPOINT: ${{ env.STIMMA_UPDATE_BASE_URL }}/stimma/${{ env.STIMMA_RELEASE_CHANNEL }}/${{ env.LINUX_PLATFORM }}/latest${{ env.ELECTRON_MANIFEST_SUFFIX }}.yml
        run: tools/stimma --channel="$CHANNEL" app build

      - name: Create Tauri-compatible updater artifact (handoff)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APPIMAGE="$(find electron/out -maxdepth 1 -name '*.AppImage' -print -quit)"
          if [ -z "$APPIMAGE" ]; then
            echo "Electron AppImage not found."
            exit 1
          fi
          ARCHIVE="${APPIMAGE}.tar.gz"
          tar -czf "$ARCHIVE" -C "$(dirname "$APPIMAGE")" "$(basename "$APPIMAGE")"
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            frontend/node_modules/.bin/tauri signer sign \
              --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
              --password "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" \
              "$ARCHIVE"
          else
            echo "TAURI_SIGNING_PRIVATE_KEY missing; handoff artifact left unsigned (staging only)."
          fi

      - name: Make electron-updater manifest immutable
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # electron-builder names prerelease manifests after the semver
          # prerelease channel (for example canary-linux.yml). Each Stimma
          # channel already has its own feed directory, and electron-updater's
          # generic provider therefore requests latest<suffix>.yml in all of
          # them. Normalize the single generated manifest before publishing.
          CHANNEL_FILE="latest${ELECTRON_MANIFEST_SUFFIX}.yml"
          mapfile -t GENERATED_MANIFESTS < <(find electron/out -maxdepth 1 -name "*${ELECTRON_MANIFEST_SUFFIX}.yml" -print)
          if [ "${#GENERATED_MANIFESTS[@]}" -ne 1 ]; then
            echo "Expected exactly one electron-updater Linux manifest; found ${#GENERATED_MANIFESTS[@]}."
            printf '%s\n' "${GENERATED_MANIFESTS[@]}"
            exit 1
          fi
          MANIFEST="electron/out/${CHANNEL_FILE}"
          if [ "${GENERATED_MANIFESTS[0]}" != "$MANIFEST" ]; then
            mv "${GENERATED_MANIFESTS[0]}" "$MANIFEST"
          fi
          test -s "$MANIFEST"
          VERSION="$VERSION" MANIFEST="$MANIFEST" python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["MANIFEST"])
          version = os.environ["VERSION"]
          lines = []
          for line in path.read_text(encoding="utf-8").splitlines():
              stripped = line.lstrip()
              indent = line[:len(line) - len(stripped)]
              if stripped.startswith("- url: "):
                  line = indent + "- url: " + version + "/" + stripped[len("- url: "):]
              elif stripped.startswith("path: "):
                  line = indent + "path: " + version + "/" + stripped[len("path: "):]
              lines.append(line)
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(path.read_text(encoding="utf-8"))
          PY

      - name: Smoke-check portable AppImage
        timeout-minutes: 5
        run: |
          set -euo pipefail
          APPIMAGE="$(find electron/out -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          test -x "$APPIMAGE"
          if readelf -d "$APPIMAGE" 2>&1 | grep -q '(NEEDED)'; then
            echo "AppImage runtime is dynamically linked; current distributions without libfuse2 would fail."
            exit 1
          fi
          "$APPIMAGE" --appimage-offset
          # Drop privileges outside xvfb-run: its X authority file is written
          # mode 600, so starting it as root would leave it unreadable to the
          # unprivileged user that actually launches the app.
          scripts/run-unprivileged.sh \
            env -u WAYLAND_DISPLAY ELECTRON_OZONE_PLATFORM_HINT=x11 xvfb-run -a \
            node electron/tests/packaged-smoke.mjs "$APPIMAGE"

      - name: Test packaged AppImage update cycle
        timeout-minutes: 10
        working-directory: electron
        run: ../scripts/run-unprivileged.sh npm run test:update-linux

      - name: Collect build artifacts
        id: collect
        run: |
          set -euo pipefail
          APPIMAGE="$(find electron/out -maxdepth 1 -name '*.AppImage' -print -quit)"
          LATEST_LINUX_YML="electron/out/latest${ELECTRON_MANIFEST_SUFFIX}.yml"
          UPDATER_ARCHIVE="${APPIMAGE}.tar.gz"
          UPDATER_SIG="${UPDATER_ARCHIVE}.sig"
          test -n "$APPIMAGE"
          test -s "$LATEST_LINUX_YML"
          test -s "$UPDATER_ARCHIVE"
          if [ ! -s "$UPDATER_SIG" ]; then
            echo "WARNING: Tauri handoff artifact is unsigned; publishing updates will fail."
            UPDATER_SIG=""
          fi
          echo "appimage_file=$APPIMAGE" >> "$GITHUB_OUTPUT"
          echo "latest_linux_yml=$LATEST_LINUX_YML" >> "$GITHUB_OUTPUT"
          echo "updater_archive=$UPDATER_ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "updater_sig=$UPDATER_SIG" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: stimma-${{ env.LINUX_PLATFORM }}-electron-${{ env.STIMMA_RELEASE_CHANNEL }}-${{ steps.version.outputs.version }}
          retention-days: 1
          path: |
            ${{ steps.collect.outputs.appimage_file }}
            ${{ steps.collect.outputs.latest_linux_yml }}
            ${{ steps.collect.outputs.updater_archive }}
            ${{ steps.collect.outputs.updater_sig }}

      - name: Publish GitHub release assets
        if: inputs.publish_github_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          prerelease: ${{ env.STIMMA_RELEASE_CHANNEL != 'production' }}
          generate_release_notes: true
          files: |
            ${{ steps.collect.outputs.appimage_file }}
            ${{ steps.collect.outputs.updater_archive }}
            ${{ steps.collect.outputs.updater_sig }}

      - name: Publish Linux artifacts to Cloudflare R2
        if: inputs.publish_updates == true
        env:
          CHANNEL: ${{ env.STIMMA_RELEASE_CHANNEL }}
          VERSION: ${{ steps.version.outputs.version }}
          APPIMAGE_FILE: ${{ steps.collect.outputs.appimage_file }}
          LATEST_LINUX_YML: ${{ steps.collect.outputs.latest_linux_yml }}
          UPDATER_ARCHIVE: ${{ steps.collect.outputs.updater_archive }}
          UPDATER_SIG: ${{ steps.collect.outputs.updater_sig }}
          BUCKET: ${{ env.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${BUCKET:-}" ] || [ -z "${R2_S3_ENDPOINT:-}" ]; then
            echo "R2_BUCKET and R2_S3_ENDPOINT repo variables are required."
            exit 1
          fi
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "R2 credentials are required."
            exit 1
          fi
          if [ -z "${UPDATER_SIG:-}" ] || [ ! -s "$UPDATER_SIG" ]; then
            echo "A signed Tauri handoff artifact is required while Tauri clients remain fielded."
            exit 1
          fi
          R2_S3_ENDPOINT="$(printf '%s' "$R2_S3_ENDPOINT" | tr -d '[:space:]')"
          AWS_ACCESS_KEY_ID="$(printf '%s' "$AWS_ACCESS_KEY_ID" | tr -d '[:space:]')"
          AWS_SECRET_ACCESS_KEY="$(printf '%s' "$AWS_SECRET_ACCESS_KEY" | tr -d '[:space:]')"
          export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY

          PREFIX="stimma/${CHANNEL}/${LINUX_PLATFORM}"
          VERSIONED_PREFIX="${PREFIX}/${VERSION}"
          APPIMAGE_BASENAME="$(basename "$APPIMAGE_FILE")"
          UPDATER_BASENAME="$(basename "$UPDATER_ARCHIVE")"
          APPIMAGE_URL_NAME="$(python3 -c 'from urllib.parse import quote; import sys; print(quote(sys.argv[1]))' "$APPIMAGE_BASENAME")"
          UPDATER_URL_NAME="$(python3 -c 'from urllib.parse import quote; import sys; print(quote(sys.argv[1]))' "$UPDATER_BASENAME")"
          SIG_VALUE="$(tr -d '\n' < "$UPDATER_SIG")"
          UPDATER_URL="${STIMMA_UPDATE_BASE_URL}/${VERSIONED_PREFIX}/${UPDATER_URL_NAME}"
          DOWNLOAD_URL="${STIMMA_UPDATE_BASE_URL}/${VERSIONED_PREFIX}/${APPIMAGE_URL_NAME}"
          DOWNLOAD_SIZE="$(stat -c%s "$APPIMAGE_FILE")"
          DOWNLOAD_SHA256="$(sha256sum "$APPIMAGE_FILE" | awk '{print $1}')"
          export APPIMAGE_BASENAME DOWNLOAD_URL DOWNLOAD_SIZE DOWNLOAD_SHA256 SIG_VALUE UPDATER_URL

          uvx --python 3.11 --from awscli aws s3 cp "$APPIMAGE_FILE" "s3://${BUCKET}/${VERSIONED_PREFIX}/${APPIMAGE_BASENAME}" --content-type application/octet-stream --cache-control "public, max-age=31536000, immutable" --endpoint-url "$R2_S3_ENDPOINT"
          uvx --python 3.11 --from awscli aws s3 cp "$UPDATER_ARCHIVE" "s3://${BUCKET}/${VERSIONED_PREFIX}/${UPDATER_BASENAME}" --content-type application/gzip --cache-control "public, max-age=31536000, immutable" --endpoint-url "$R2_S3_ENDPOINT"
          uvx --python 3.11 --from awscli aws s3 cp "$UPDATER_SIG" "s3://${BUCKET}/${VERSIONED_PREFIX}/${UPDATER_BASENAME}.sig" --content-type text/plain --cache-control "public, max-age=31536000, immutable" --endpoint-url "$R2_S3_ENDPOINT"

          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone

          manifest = {
              "version": os.environ["VERSION"],
              "notes": "Stimma desktop update",
              "pub_date": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "platforms": {
                  os.environ["LINUX_PLATFORM"]: {
                      "signature": os.environ["SIG_VALUE"],
                      "url": os.environ["UPDATER_URL"],
                  }
              },
          }
          with open("latest.json", "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, indent=2)
              fh.write("\n")
          PY

          EXISTING_LATEST="${RUNNER_TEMP}/existing-latest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          rm -f "$EXISTING_LATEST"
          set +e
          uvx --python 3.11 --from awscli aws s3 cp "s3://${BUCKET}/${PREFIX}/latest.json" "$EXISTING_LATEST" --endpoint-url "$R2_S3_ENDPOINT"
          existing_fetch_code=$?
          set -e
          if [ "$existing_fetch_code" -ne 0 ]; then
            echo "No existing latest.json found in release bucket."
          fi

          set +e
          CANDIDATE_VERSION="$VERSION" EXISTING_MANIFEST="$EXISTING_LATEST" python3 - <<'PY'
          import json, os, re, sys

          def key(version):
              match = re.match(r"^(\d+)\.(\d+)\.(\d+)(?:-(?:(sandbox|canary|beta)\.)?(\d+))?$", version)
              if not match:
                  raise SystemExit(f"Unparseable version: {version}")
              core = tuple(int(match.group(i)) for i in range(1, 4))
              rank = {"sandbox": 0, "canary": 1, "beta": 2, "production": 3}.get(match.group(4) or os.environ["CHANNEL"], 0)
              return (*core, rank, int(match.group(5) or 0))

          existing = None
          if os.path.exists(os.environ["EXISTING_MANIFEST"]):
              with open(os.environ["EXISTING_MANIFEST"], encoding="utf-8") as fh:
                  existing = json.load(fh).get("version")
          candidate = os.environ["CANDIDATE_VERSION"]
          if existing and key(candidate) < key(existing):
              print(f"Refusing to move updater manifests backward from {existing} to {candidate}.")
              sys.exit(42)
          PY
          guard_code=$?
          set -e
          if [ "$guard_code" -eq 42 ]; then
            exit 0
          elif [ "$guard_code" -ne 0 ]; then
            exit "$guard_code"
          fi

          uvx --python 3.11 --from awscli aws s3 cp latest.json "s3://${BUCKET}/${PREFIX}/latest.json" --content-type application/json --cache-control "no-cache" --endpoint-url "$R2_S3_ENDPOINT"
          uvx --python 3.11 --from awscli aws s3 cp "$LATEST_LINUX_YML" "s3://${BUCKET}/${PREFIX}/latest${ELECTRON_MANIFEST_SUFFIX}.yml" --content-type application/yaml --cache-control "no-cache" --endpoint-url "$R2_S3_ENDPOINT"

          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone

          manifest = {
              "version": os.environ["VERSION"],
              "channel": os.environ["CHANNEL"],
              "platform": os.environ["LINUX_PLATFORM"],
              "filename": os.environ["APPIMAGE_BASENAME"],
              "url": os.environ["DOWNLOAD_URL"],
              "size": int(os.environ["DOWNLOAD_SIZE"]),
              "sha256": os.environ["DOWNLOAD_SHA256"],
              "pub_date": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
          }
          with open("download.json", "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, indent=2)
              fh.write("\n")
          PY
          uvx --python 3.11 --from awscli aws s3 cp download.json "s3://${BUCKET}/${PREFIX}/download.json" --content-type application/json --cache-control "no-cache" --endpoint-url "$R2_S3_ENDPOINT"

      - name: Purge Cloudflare cache for Linux manifests
        if: inputs.publish_updates == true
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CHANNEL: ${{ env.STIMMA_RELEASE_CHANNEL }}
        run: |
          set -euo pipefail
          if [ -z "${CF_API_TOKEN:-}" ] || [ -z "${CF_ZONE_ID:-}" ]; then
            echo "CF_API_TOKEN and CF_ZONE_ID secrets are required."
            exit 1
          fi
          PREFIX="${STIMMA_UPDATE_BASE_URL}/stimma/${CHANNEL}/${LINUX_PLATFORM}"
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"files\":[\"${PREFIX}/latest.json\",\"${PREFIX}/latest${ELECTRON_MANIFEST_SUFFIX}.yml\",\"${PREFIX}/download.json\"]}"
