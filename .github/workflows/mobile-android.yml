name: Android checks

on:
  push:
    branches: [main]
    paths:
      - 'mobile/android/**'
      - 'frontend/**'
      - 'tools/mobile*.py'
      - '.github/workflows/mobile-android.yml'
  pull_request:
    paths:
      - 'mobile/android/**'
      - 'frontend/**'
      - 'tools/mobile*.py'
      - '.github/workflows/mobile-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install frontend test dependencies
        working-directory: frontend
        run: |
          npm ci
          npm exec -- playwright install --with-deps chromium
      - name: Test Android protocol and phone behavior
        run: tools/stimma mobile android test
      - name: Build Android development app
        run: tools/stimma mobile android build
      - name: Lint Android shell
        run: tools/stimma mobile android lint
      - uses: actions/upload-artifact@v4
        with:
          name: stimma-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
