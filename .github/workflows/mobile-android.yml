name: Android checks

on:
  push:
    branches: [main]
    paths:
      - 'mobile/android/**'
      - 'frontend/**'
      - 'tools/mobile*.py'
      - '.github/workflows/mobile-android.yml'
  pull_request:
    paths:
      - 'mobile/android/**'
      - 'frontend/**'
      - 'tools/mobile*.py'
      - '.github/workflows/mobile-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    # Playwright in the lockfile does not support Ubuntu 26.04 yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # The action's default also requests the retired SDK `tools` package.
          # Install the supported platform tools; the required SDK platform and
          # build tools are installed explicitly below.
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.8
      - name: Install frontend test dependencies
        working-directory: frontend
        run: |
          npm ci
          npm exec -- playwright install --with-deps chromium
      - name: Test Android protocol and phone behavior
        run: tools/stimma mobile android test
      - name: Build Android development app
        run: tools/stimma mobile android build
      - name: Lint Android shell
        run: tools/stimma mobile android lint
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stimma-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
