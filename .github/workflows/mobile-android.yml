name: Android checks

on:
  push:
    branches: [main]
    paths:
      - 'mobile/android/**'
      - 'frontend/**'
      - 'tools/mobile*.py'
      - '.github/workflows/mobile-android.yml'
  pull_request:
    paths:
      - 'mobile/android/**'
      - 'frontend/**'
      - 'tools/mobile*.py'
      - '.github/workflows/mobile-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    # Playwright in the lockfile does not support Ubuntu 26.04 yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The action's default also requests the retired SDK `tools` package.
          # Install the supported platform tools; the required SDK platform and
          # build tools are installed explicitly below.
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.8
      - name: Install frontend test dependencies
        working-directory: frontend
        run: |
          npm ci
          npm exec -- playwright install --with-deps chromium
      - name: Test Android protocol and phone behavior
        run: tools/stimma mobile android test
      - name: Build Android development app
        run: tools/stimma mobile android build
      - name: Lint Android shell
        run: tools/stimma mobile android lint
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stimma-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
