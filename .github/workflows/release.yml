name: Release
run-name: Release - ${{ github.ref_name || inputs.ref || 'manual' }}

on:
  push:
    branches:
      - "release/*"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag or release/X.Y.Z branch
        required: true
        default: main
      validate_only:
        description: Build and test a ref without creating tags or publishing
        type: boolean
        default: false
      skip_quality_gate:
        description: Emergency bypass for the release quality gate
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

# Releases must not overlap: concurrent runs race on the self-hosted macOS
# signer — one run's keychain cleanup strips the other's active signing
# keychain from the search list mid-codesign (errSecInternalComponent).
# Queue instead of cancel: a beta and its production promotion may both be
# tagged within minutes and both must ship.
concurrency:
  group: release-signing
  cancel-in-progress: false

jobs:
  release-meta:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.source.outputs.ref }}
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      automatic: ${{ steps.meta.outputs.automatic }}

    steps:
      - name: Resolve metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          INPUT_REF: ${{ inputs.ref }}
          VALIDATE_ONLY: ${{ inputs.validate_only }}
        run: |
          set -euo pipefail
          ref="$REF"
          ref_name="$REF_NAME"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ref="$INPUT_REF"
            ref_name="${ref#refs/tags/}"
            ref_name="${ref_name#refs/heads/}"
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$VALIDATE_ONLY" = "true" ]; then
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
            echo "version=0.0.0-beta.1" >> "$GITHUB_OUTPUT"
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$ref_name" =~ ^release/([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            # Pushes test precisely the commit that triggered this run.
            if [ "$EVENT_NAME" = "push" ]; then ref="$SHA"; fi
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "automatic=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$ref_name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            channel="beta"
          elif [[ "$ref_name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            channel="production"
          else
            echo "Release refs must be tags like v1.2.3 or v1.2.3-beta.1."
            exit 1
          fi

          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=${ref_name#v}" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.ref }}
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        if: ${{ steps.meta.outputs.automatic == 'true' }}
      - name: Plan release version without tagging
        id: version
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          AUTOMATIC: ${{ steps.meta.outputs.automatic }}
        run: |
          set -euo pipefail
          if [ "$AUTOMATIC" = "true" ]; then
            tag="$(git tag --points-at HEAD --list "v${VERSION}-beta.*" | sort -V | tail -n1)"
            if [ -z "$tag" ]; then tag="$(tools/stimma tag beta "$VERSION" --dry-run)"; fi
            VERSION="${tag#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Pin source commit
        id: source
        run: echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  quality-gate:
    name: Quality gate
    needs: release-meta
    if: ${{ needs.release-meta.outputs.automatic == 'true' || !inputs.skip_quality_gate }}
    uses: ./.github/workflows/quality-gate.yml
    with:
      ref: ${{ needs.release-meta.outputs.ref }}
      runs_on: '["self-hosted","linux","x64","stimma-test"]'

  release-ref:
    name: Release publication permitted
    needs: [release-meta, quality-gate]
    if: ${{ always() && needs.release-meta.result == 'success' && (needs.quality-gate.result == 'success' || (inputs.skip_quality_gate && needs.release-meta.outputs.automatic != 'true')) }}
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ needs.release-meta.outputs.ref }}
      version: ${{ steps.release.outputs.version }}
      channel: ${{ needs.release-meta.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-meta.outputs.ref }}
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        if: ${{ needs.release-meta.outputs.automatic == 'true' }}
      - name: Resolve release tag
        id: release
        env:
          AUTOMATIC: ${{ needs.release-meta.outputs.automatic }}
          VERSION: ${{ needs.release-meta.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$AUTOMATIC" = "true" ]; then
            git config user.name stimmant
            git config user.email stimmant@stimma.ai
            git fetch --tags origin
            tag="v${VERSION}"
            if git show-ref --verify --quiet "refs/tags/$tag"; then
              test "$(git rev-parse "$tag^{commit}")" = "$(git rev-parse HEAD)"
            else
              tools/stimma tag beta "${VERSION%-beta.*}" --expected-tag "$tag"
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS
    needs: release-meta
    uses: ./.github/workflows/release-macos.yml
    with:
      ref: ${{ needs.release-meta.outputs.ref }}
      channel: ${{ needs.release-meta.outputs.channel }}
      version: ${{ needs.release-meta.outputs.version }}
      publish_updates: ${{ !inputs.validate_only }}
      publish_github_release: ${{ !inputs.validate_only }}
      wait_for_quality_gate: true
      publication_gate: Release publication permitted
    secrets: inherit

  windows:
    name: Windows
    needs: release-meta
    uses: ./.github/workflows/release-windows.yml
    with:
      ref: ${{ needs.release-meta.outputs.ref }}
      channel: ${{ needs.release-meta.outputs.channel }}
      version: ${{ needs.release-meta.outputs.version }}
      publish_updates: ${{ !inputs.validate_only }}
      publish_github_release: ${{ !inputs.validate_only }}
      wait_for_quality_gate: true
      publication_gate: Release publication permitted
    secrets: inherit

  linux:
    name: Linux AppImage x64
    needs: release-meta
    uses: ./.github/workflows/linux-appimage.yml
    with:
      ref: ${{ needs.release-meta.outputs.ref }}
      channel: ${{ needs.release-meta.outputs.channel }}
      version: ${{ needs.release-meta.outputs.version }}
      publish_updates: ${{ !inputs.validate_only }}
      publish_github_release: ${{ !inputs.validate_only }}
      wait_for_quality_gate: true
      publication_gate: Release publication permitted
    secrets: inherit

  release-notes:
    name: Publish release notes
    needs:
      - release-ref
      - macos
      - windows
      - linux
      - linux-arm64
    # Production only: re-publishing rebuilds notes/index.json so this
    # version's "released" flag flips once the release actually shipped.
    # Notes content is read from main, not the tagged commit — notes edits
    # may land after the promoted commit was tagged.
    if: ${{ !inputs.validate_only && needs.release-ref.outputs.channel == 'production' }}
    runs-on: ubuntu-latest
    env:
      BUCKET: ${{ vars.R2_BUCKET }}
      R2_S3_ENDPOINT: ${{ vars.R2_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Publish notes to R2
        run: bash scripts/publish-release-notes.sh

  linux-arm64:
    name: Linux AppImage arm64
    needs: release-meta
    uses: ./.github/workflows/linux-appimage.yml
    with:
      ref: ${{ needs.release-meta.outputs.ref }}
      channel: ${{ needs.release-meta.outputs.channel }}
      version: ${{ needs.release-meta.outputs.version }}
      publish_updates: ${{ !inputs.validate_only }}
      publish_github_release: ${{ !inputs.validate_only }}
      wait_for_quality_gate: true
      publication_gate: Release publication permitted
      arch: aarch64
      runs_on: '["self-hosted","linux","arm64","spark"]'
    secrets: inherit

  headless:
    name: Headless Linux
    needs: release-meta
    uses: ./.github/workflows/headless-package.yml
    with:
      ref: ${{ needs.release-meta.outputs.ref }}
      channel: ${{ needs.release-meta.outputs.channel }}
      version: ${{ needs.release-meta.outputs.version }}
      publish_updates: ${{ !inputs.validate_only }}
      wait_for_quality_gate: true
      publication_gate: Release publication permitted
    secrets: inherit
