name: Publish / Stimma Server image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packaging/headless/Dockerfile'
      - 'packaging/headless/Dockerfile.dockerignore'
      - 'packaging/headless/supervisor.py'
      - 'packaging/headless/stimma-server'
      - 'packaging/headless/VERSION'
      - 'packaging/headless/updater.pub'
      - '.github/workflows/headless-bootstrap.yml'
permissions:
  contents: read
  packages: write
concurrency:
  group: headless-bootstrap
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: denoland/setup-deno@v2
      - name: Test supervisor and backend management
        run: |
          cd backend
          uv sync --locked --extra dev
          cd ..
          tools/stimma headless test
      - name: Prepare bootstrap metadata
        id: metadata
        env:
          PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          test -n "$PUBLIC_KEY"
          printf '%s' "$PUBLIC_KEY" | base64 -d > packaging/headless/updater.pub
          echo "version=$(cat packaging/headless/VERSION)" >> "$GITHUB_OUTPUT"
          echo "recipe=$(cat packaging/headless/Dockerfile packaging/headless/supervisor.py packaging/headless/stimma-server packaging/headless/updater.pub packaging/headless/VERSION | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: headless-public-key
          path: packaging/headless/updater.pub
          retention-days: 7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Require a new immutable bootstrap version
        id: existing
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          RECIPE: ${{ steps.metadata.outputs.recipe }}
        run: |
          if docker buildx imagetools inspect "ghcr.io/stimma-ai/stimma-server:$VERSION" >/dev/null 2>&1; then
            docker pull "ghcr.io/stimma-ai/stimma-server:$VERSION"
            existing=$(docker inspect "ghcr.io/stimma-ai/stimma-server:$VERSION" --format '{{ index .Config.Labels "ai.stimma.bootstrap.recipe" }}')
            if [ "$existing" = "$RECIPE" ]; then
              echo "reuse=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Bootstrap version already published. Bump packaging/headless/VERSION before publishing changed base contents."
            exit 1
          fi
      - uses: docker/build-push-action@v6
        if: steps.existing.outputs.reuse != 'true'
        with:
          context: .
          file: packaging/headless/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BOOTSTRAP_VERSION=${{ steps.metadata.outputs.version }}
            BOOTSTRAP_RECIPE=${{ steps.metadata.outputs.recipe }}
          tags: |
            ghcr.io/stimma-ai/stimma-server:latest
            ghcr.io/stimma-ai/stimma-server:${{ steps.metadata.outputs.version }}
