name: Publish / Stimma Server image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packaging/headless/render-requirements.txt'
      - 'packaging/headless/Dockerfile'
      - 'packaging/headless/Dockerfile.dockerignore'
      - 'packaging/headless/supervisor.py'
      - 'packaging/headless/stimma-server'
      - 'packaging/headless/VERSION'
      - 'packaging/headless/updater.pub'
      - '.github/workflows/headless-bootstrap.yml'
permissions:
  contents: read
  packages: write
concurrency:
  group: headless-bootstrap
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: ${{ runner.environment == 'github-hosted' }}
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: 'v2.9.8'
      - name: Test supervisor and backend management
        run: |
          cd backend
          uv sync --locked --extra dev
          cd ..
          tools/stimma headless test
      - name: Prepare bootstrap metadata
        id: metadata
        env:
          PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          test -n "$PUBLIC_KEY"
          printf '%s' "$PUBLIC_KEY" | base64 -d > packaging/headless/updater.pub
          echo "version=$(cat packaging/headless/VERSION)" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$(cat packaging/headless/render-requirements.txt packaging/headless/Dockerfile packaging/headless/supervisor.py packaging/headless/stimma-server packaging/headless/updater.pub packaging/headless/VERSION | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: headless-public-key
          path: packaging/headless/updater.pub
          retention-days: 7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Require a new immutable bootstrap version
        id: existing
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          FINGERPRINT: ${{ steps.metadata.outputs.fingerprint }}
        run: |
          if docker buildx imagetools inspect "ghcr.io/stimma-ai/stimma-server:$VERSION" >/dev/null 2>&1; then
            docker pull "ghcr.io/stimma-ai/stimma-server:$VERSION"
            existing=$(docker inspect "ghcr.io/stimma-ai/stimma-server:$VERSION" --format '{{ index .Config.Labels "ai.stimma.bootstrap.fingerprint" }}')
            if [ "$existing" = "$FINGERPRINT" ]; then
              echo "reuse=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Bootstrap version already published. Bump packaging/headless/VERSION before publishing changed base contents."
            exit 1
          fi
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.existing.outputs.reuse != 'true'
        with:
          context: .
          file: packaging/headless/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BOOTSTRAP_VERSION=${{ steps.metadata.outputs.version }}
            BOOTSTRAP_FINGERPRINT=${{ steps.metadata.outputs.fingerprint }}
          tags: |
            ghcr.io/stimma-ai/stimma-server:latest
            ghcr.io/stimma-ai/stimma-server:${{ steps.metadata.outputs.version }}
