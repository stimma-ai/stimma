name: iOS checks

on:
  push:
    branches: [main]
    paths:
      - 'mobile/ios/**'
      - 'frontend/src/desktop/mobile*.ts'
      - 'frontend/src/utils/mobile*.ts'
      - 'frontend/src/utils/nativeShare.ts'
      - 'frontend/src/composables/useMobilePlaybackLifecycle.js'
      - 'frontend/src/composables/useMobileRecovery.js'
      - 'frontend/src/utils/recoveryWindow.js'
      - 'frontend/plugins/mobileDevReconnect.js'
      - 'frontend/tests/*Recovery*'
      - 'frontend/tests/recoveryWindow.test.mjs'
      - 'frontend/tests/mobileReadiness*'
      - 'tools/mobile.py'
      - '.github/workflows/mobile-ios.yml'
  pull_request:
    paths:
      - 'mobile/ios/**'
      - 'frontend/src/desktop/mobile*.ts'
      - 'frontend/src/utils/mobile*.ts'
      - 'frontend/src/utils/nativeShare.ts'
      - 'frontend/src/composables/useMobilePlaybackLifecycle.js'
      - 'frontend/src/composables/useMobileRecovery.js'
      - 'frontend/src/utils/recoveryWindow.js'
      - 'frontend/plugins/mobileDevReconnect.js'
      - 'frontend/tests/*Recovery*'
      - 'frontend/tests/recoveryWindow.test.mjs'
      - 'frontend/tests/mobileReadiness*'
      - 'tools/mobile.py'
      - '.github/workflows/mobile-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.8
      - name: Install frontend test dependencies
        working-directory: frontend
        run: |
          npm ci
          npm exec -- playwright install chromium
      - name: Run mobile regression checks
        run: tools/stimma mobile ios test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Compile iOS shell
        run: tools/stimma mobile ios build --unsigned-device
