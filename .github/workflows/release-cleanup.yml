name: Release storage cleanup

on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: Delete eligible builds (otherwise dry run)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-storage-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    # Scheduled deletion and credential use are limited to the default branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: ${{ runner.environment == 'github-hosted' }}
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: 'v2.9.8'
      - name: Test retention and latest-build protection
        run: tools/stimma test release-cleanup
      - name: Clean release storage
        env:
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_S3_ENDPOINT: ${{ vars.R2_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
          REPORT: ${{ runner.temp }}/release-cleanup.json
        run: |
          args=(--report "$REPORT")
          if [ "$APPLY" = true ]; then args+=(--apply); fi
          tools/stimma releases cleanup "${args[@]}"
      - name: Save cleanup receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-cleanup-${{ github.run_id }}
          path: ${{ runner.temp }}/release-cleanup.json
          if-no-files-found: warn
          retention-days: 90
