name: Build / Stimma Server package
on:
  workflow_call:
    inputs:
      publication_gate:
        description: Job that must succeed before any release publication
        type: string
        default: Quality gate passed
      wait_for_quality_gate:
        description: Wait for this run's quality gate before publishing
        type: boolean
        default: false
      ref:
        required: true
        type: string
      channel:
        required: true
        type: string
      version:
        required: true
        type: string
      publish_updates:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      ref:
        required: true
        default: main
      channel:
        type: choice
        options: [production, beta, canary]
        default: canary
      version:
        required: true
      publish_updates:
        type: boolean
        default: false
permissions:
  actions: read
  contents: read
concurrency:
  group: headless-packages-${{ inputs.channel }}
  cancel-in-progress: false
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs_on: '["self-hosted","linux","x64","stimma-headless"]'
          - arch: arm64
            runs_on: '["self-hosted","linux","arm64","stimma-headless"]'
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    timeout-minutes: 40
    env:
      BOOTSTRAP_IMAGE: stimma-server:ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
      STIMMA_SMOKE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@v6
      - uses: denoland/setup-deno@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify prepared packaging tools
        run: |
          for tool in patchelf rsync file docker; do command -v "$tool"; done
          docker info --format '{{.OSType}}/{{.Architecture}}'
      - name: Configure persistent build cache
        run: python3 scripts/configure-build-cache.py
      - name: Install test dependencies
        working-directory: backend
        run: uv sync --locked --extra dev
      - name: Verify headless controls and installer
        run: tools/stimma headless test
      - name: Prepare release verification key
        env:
          PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          test -n "$PUBLIC_KEY"
          printf '%s' "$PUBLIC_KEY" | base64 -d > packaging/headless/updater.pub
      - name: Build package
        env:
          VERSION: ${{ inputs.version }}
          BRANCH: ${{ inputs.channel }}
        run: tools/stimma headless package --version "$VERSION" --branch "$BRANCH"
      - name: Build bootstrap for validation only
        run: tools/stimma headless image --tag "$BOOTSTRAP_IMAGE"
      - name: Verify signed startup and unchanged-image updates
        run: tools/stimma headless smoke --tag "$BOOTSTRAP_IMAGE"

      - name: Install release signer
        if: inputs.publish_updates
        working-directory: frontend
        run: npm ci

      - name: Wait for matching quality gate
        if: inputs.wait_for_quality_gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STIMMA_PUBLICATION_GATE: ${{ inputs.publication_gate }}
        run: python3 scripts/wait-for-quality-gate.py

      - name: Publish signed headless feed
        if: inputs.publish_updates
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_S3_ENDPOINT: ${{ vars.R2_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: tools/stimma headless publish

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          compression-level: 0
          name: headless-${{ matrix.arch }}
          path: dist-headless/
          retention-days: 7

      - name: Remove this run's smoke resources
        if: always()
        run: |
          label="ai.stimma.smoke=$STIMMA_SMOKE_RUN_ID"
          docker ps -aq --filter "label=$label" | xargs -r docker rm -f
          docker volume ls -q --filter "label=$label" | xargs -r docker volume rm
          docker image rm "$BOOTSTRAP_IMAGE" || true
