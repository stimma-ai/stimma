version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    # These API/storage migrations need dedicated compatibility work.
    ignore:
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]
      - dependency-name: sqlalchemy
        versions: [">2.0.23"]
    groups:
      backend:
        patterns:
          - "*"
  - package-ecosystem: npm
    directories:
      - /frontend
      - /electron
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - "*"
