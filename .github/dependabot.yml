version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      backend:
        patterns:
          - "*"
  - package-ecosystem: npm
    directories:
      - /frontend
      - /electron
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    # Tailwind 4 requires a separate PostCSS and theme migration.
    ignore:
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - "*"
