name: Setup Playwright
description: Install locked Chromium and use the runner's existing system libraries when possible
runs:
  using: composite
  steps:
    - name: Install locked Chromium
      shell: bash
      working-directory: frontend
      run: npx --no-install playwright install chromium
    - name: Verify Chromium launches
      shell: bash
      working-directory: frontend
      run: |
        verify_chromium() {
          node --input-type=module -e '
            import { chromium } from "playwright";
            const browser = await chromium.launch({ timeout: 10000 });
            console.log(`Chromium ${browser.version()} is ready`);
            await browser.close();
          '
        }

        if verify_chromium; then
          exit 0
        fi
        if [ "${STIMMA_PREPROVISIONED:-}" = "1" ]; then
          # System libraries on prepared workers belong in the runner image.
          exit 1
        fi

        # Hosted images already ship the libraries Chromium generally needs.
        # Refreshing apt on every job exposes browser setup to slow mirrors.
        echo "Chromium launch failed; installing Playwright system dependencies."
        npx --no-install playwright install-deps chromium
        verify_chromium
