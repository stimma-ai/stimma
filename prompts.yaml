    REFERENCE CAPTIONS — 20 real training captions. Your output must be statistically indistinguishable from these in register, vocabulary, sentence rhythm, density, length, and level of incidental real-world detail. They show HOW to write, never WHAT to write:

    [1] Full-color outdoor photograph, shot as a close-up macro with a shallow depth of field, isolating the subject against a smooth, blurred background of dark greens and muted browns. The hard, directional sunlight comes from the upper left, casting sharp shadows underneath the subject and along the textured perch. In the center, dominating the frame, a small songbird—appearing to be a House Finch or similar species—perches on a diagonally sloping branch. The bird has a thick, conical, pale grey-brown beak, a dark eye, and striking plumage: its head, breast, and upper back are a vibrant, mottled crimson-red, blending into streaked brown and white feathers on its flanks and wings. The wings feature darker brown flight feathers with pale edges, neatly folded over its back, while the tail extends horizontally to the left. The bird's pale pinkish-grey legs and thin claws grip the rough bark of the branch. The branch itself, extending from the middle-left towards the lower right corner, is pale grey-brown with textured, peeling bark and a small offshoot pointing upward near the left edge. The smooth, out-of-focus background creates a soft, dark green and shadowy environment, highlighting the sharp details and rich colors of the bird and branch.

    [2] Cinematic portrait photograph, graded with a moody, desaturated palette leaning toward cool teal and deep shadows. The scene is a dimly lit interior setting beside a weathered window, shot from a close-up, eye-level angle with a shallow depth of field that softens the background. Soft, diffused daylight enters from the left, raking across the subject's face and highlighting the textures of the window frame while casting deep, cool-toned shadows across the right side of the frame. On the left side of the frame, an open wooden window shutter, painted a faded, distressed blue, swings inward, revealing recessed paneling. Below it, a thick, textured window sill spans horizontally toward the lower center, showing peeling paint and age. Frame-right, an elderly South Asian woman sits facing left, gazing out the window with a solemn expression. She has medium-brown skin with deep wrinkles, dark eyes, and short, gray, wavy hair parted on the side. She wears a simple black short-sleeved blouse beneath a white sari adorned with dark blue block-printed floral motifs, draped over her right shoulder. A thin black string necklace rests on her chest, a small gold nose stud catches the light, and a gold stud earring is visible on her left earlobe. The background behind her fades into a deep, indistinct, cool-toned shadow, emphasizing the solitary, contemplative atmosphere.

    [3] Anime-style illustration of a cozy, sunlit indoor music studio set against a large A-frame window looking out onto a lush, green forest. The scene is bathed in warm, hard midday sunlight streaming through the glass, casting distinct shadows on the wooden floor. The interior features wood-paneled walls and ceiling, decorated with strings of small orange paper lanterns hanging near the apex. Frame-left, a cluster of electronic musical instruments dominates the space: two angled synthesizer keyboards stacked on stands, with a smaller MIDI controller and patch bay module beneath them. Various potted plants dot the room, adding greenery on shelves and the floor. In the center midground, a person sits with their back to the viewer in a white, rounded swivel chair, facing a large wooden desk. The person, whose ethnicity, gender, and age are not fully discernible from behind, wears a dark beanie and a red and black jacket. The desk is loaded with audio equipment: a central computer monitor displaying a colorful interface, flanked by two large, boxy studio monitor speakers, each resting on top of a vintage-looking stereo receiver or amplifier unit. A black articulating desk lamp stands to the left of the monitor, and black headphones rest on the desk to the right. Frame-right, a tall wooden bookcase filled with colorful spines stands against the wall, with a small silver Buddha statue resting on top. Near the bookcase, two potted plants sit on the floor, basking in the sunlight. A wall shelf above the bookcase holds another small plant and a rectangular radio. The overall palette is rich and warm, combining the earthy browns of the interior with the vibrant greens of the foliage outside, rendered with clean lines and cell-shaded lighting typical of modern lofi anime aesthetics.

    [4] Flat vector illustration with a geometric, mid-century modern aesthetic, arranged as a tight, vibrant collage of stylized vignettes celebrating a coastal city. The palette relies on bold, unmodulated blocks of cyan blue, deep crimson red, warm mustard yellow, and very dark brown, rendered with sharp edges and no shading. The composition is a dense, edge-to-edge patchwork, lacking a single unified perspective, instead presenting a grid-like array of scenes and icons. In the upper left corner, against a light gray rectangular backing box with a thin dark border, bold red sans-serif text reads "VANCITY". Below this header, dark brown stylized mountains with snow-capped peaks sit beneath a rising or setting sun with radiating beams, flanked by small, simplified trees. A panel below shows a geometric bird perched on a branch composed of dark brown, diamond-shaped leaves against a mustard yellow background. In the upper center, a dark brown L-shaped street wraps around a dark red multi-story building featuring a striped awning and a tiny table set outside. A simplified rainbow arcs above it in a cyan sky, while stylized black teardrop shapes representing rain fall vertically beside it. The upper right quadrant is dominated by a cyan sky and a stylized suspension bridge in dark brown above wavy red and yellow lines indicating water, where a simplified cyan and brown cargo ship floats. Below the ship, a stylized whale breaches the surface against a mustard background, next to a tall, dark brown, multi-story building with small, colorful rectangular windows. Moving down the left side, a stylized red train with cyan wheels crosses a brown truss bridge over water, and further down, two identical, stylized blue and red residential houses sit side-by-side. In the center of the image, a prominent spherical structure composed of red and blue triangles (suggesting Science World) sits atop a dark brown and cyan base, flanked by more black raindrops. Below it, another red train crosses a truss bridge. The mid-right area features more mountains, a circular sun, and another truss bridge, with wavy water lines and small trees below. The bottom left corner shows construction cranes against a yellow background, above a stylized coffee cup and cutlery. Next to this, a red clock tower, reminiscent of the Gastown Steam Clock, stands tall. To the right of the clock tower, a simple park bench sits beneath trees. The bottom right corner is occupied by a large, stylized bicycle depicted in outline form, traversing a bumpy, dotted path over a brown surface. At the very bottom center, delicate white script text reads "Beautiful British Columbia" across a dark brown horizontal band that anchors the entire composition.

