services:
  stimma:
    image: ghcr.io/stimma-ai/stimma-server:latest
    container_name: stimma
    restart: unless-stopped
    # An update waits for its database migration before stopping; stopping
    # sooner leaves a recovery record the next start refuses to run past.
    # Avoid stopping mid-update, or pass a longer `docker compose stop -t`.
    stop_grace_period: 2m
    network_mode: host
    security_opt:
      - seccomp=./render-seccomp.json
    environment:
      TZ: UTC
      # Optional: update overnight when no work is running.
      # UPDATE_WINDOW: "03:00-05:00"
      # Set TZ above to your local timezone when scheduling updates.
    volumes:
      - stimma-data:/data
      # Optional external media, mounted read-only:
      # - /path/to/media:/media:ro
volumes:
  stimma-data:
