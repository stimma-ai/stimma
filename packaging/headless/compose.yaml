services:
  stimma:
    image: ghcr.io/stimma-ai/stimma-headless:latest
    container_name: stimma
    restart: unless-stopped
    stop_grace_period: 2m
    network_mode: host
    environment:
      TZ: UTC
      # Optional: update overnight when no work is running.
      # UPDATE_WINDOW: "03:00-05:00"
      # Set TZ above to your local timezone when scheduling updates.
    volumes:
      - stimma-data:/data
      # Optional external media, mounted read-only:
      # - /path/to/media:/media:ro
volumes:
  stimma-data:
